<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header>
    <p class="site-name"><a href="index.html" class="name-link">Stan Alcorn</a></p>
    <nav class="main-nav" aria-label="Main">
      <a href="audio.html">Audio</a>
      <a href="writing.html">Writing</a>

      <a href="etc.html">Etc.</a>
      <a href="awards.html">Awards</a>
      <a href="contact.html" class="active" aria-current="page">Contact</a>
    </nav>
  </header>

  <main class="contact-page" id="main">
    <h1>Contact</h1>
    <form id="contactForm">
      <div class="contact-field">
        <label for="contactName">Name</label>
        <input type="text" id="contactName" name="name" autocomplete="name" class="contact-input" required>
      </div>
      <div class="contact-field">
        <label for="contactEmail">Email</label>
        <input type="email" id="contactEmail" name="email" autocomplete="email" class="contact-input" required>
      </div>
      <div class="contact-field">
        <label for="contactMessage">Message</label>
        <textarea id="contactMessage" name="message" class="contact-textarea" required></textarea>
      </div>
      <button type="submit" class="subscribe-btn">Send</button>
    </form>
    <!-- Outside the form on purpose: on success the form is hidden, and a
         status message nested inside it would be hidden along with it. -->
    <p class="subscribe-msg" id="contactMsg" role="status" hidden></p>
  </main>

<footer class="site-footer">
  <div class="footer-inner">
    <h2 class="footer-heading">Sign up for my newsletter!</h2>
    <p class="footer-sub">Receive news and surprises, infrequently.</p>
    <form class="subscribe-form" id="subscribeForm">
      <div class="subscribe-row">
        <label class="visually-hidden" for="subscribeEmail">Email address</label>
        <input type="email" id="subscribeEmail" name="email" autocomplete="email"
               placeholder="your@email.com" required class="subscribe-input">
        <button type="submit" class="subscribe-btn">Subscribe</button>
      </div>
      <p class="subscribe-msg" id="subscribeMsg" role="status" hidden></p>
    </form>
  </div>
</footer>
  <script src="forms.js" defer></script>
</body>
</html>
