name: Daily Dropbox Backup

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  trigger-backup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger backup on PythonAnywhere
        run: |
          response=$(curl -s -w "\n%{http_code}" "https://stanonymous.pythonanywhere.com/run-backup?key=${{ secrets.BACKUP_KEY }}")
          status="${response##*$'\n'}"
          body="${response%$'\n'*}"
          echo "$body"
          echo "HTTP status: $status"
          if [ "$status" -ge 400 ]; then
            exit 1
          fi
